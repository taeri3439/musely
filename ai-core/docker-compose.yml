# ai-core 단독 실행용. 백엔드가 파이썬을 세팅하지 않고 mock을 띄우기 위한 것.
#
#   docker compose up --build
#   -> http://localhost:8000/docs
#
# 3주차 통합에서는 여기에 backend / postgres / frontend 서비스를 붙이거나,
# 백엔드 레포의 compose에서 이 이미지를 참조한다. 그때 백엔드가 부르는 주소는
# localhost가 아니라 서비스 이름인 http://ai-core:8000 이 된다.

services:
  ai-core:
    build: .
    container_name: musely-ai-core
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    # 1주차 mock은 환경 변수가 필요 없다(설정에 전부 기본값이 있다).
    # 2주차에 LLM·벡터DB를 붙일 때 아래를 열고 .env를 만든다.
    #   cmd: copy .env.example .env
    # env_file:
    #   - .env

    # 나연 로컬에서 코드 수정 즉시 반영하고 싶을 때만 아래를 열 것.
    # 백엔드는 열지 않는다(이미지 안의 코드로 그냥 돌리면 된다).
    # volumes:
    #   - ./app:/app/app
    #   - ./mock:/app/mock
    #   - ./data:/app/data
    # command: uvicorn mock.mock_server:app --host 0.0.0.0 --port 8000 --workers 1 --reload
